apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: utility-rollout
  namespace: production
  labels:
    app: utility-app
    environment: production
spec:
  replicas: 3
  strategy:
    blueGreen:
      activeService: utility-service
      previewService: utility-preview-service
      autoPromotionEnabled: false    # Manual promotion for production safety
      scaleDownDelaySeconds: 300     # 5 minutes to validate before scaling down old version
      prePromotionAnalysis:
        templates:
        - templateName: health-check
        args:
        - name: service-name
          value: utility-preview-service
  selector:
    matchLabels:
      app: utility-app
  template:
    metadata:
      labels:
        app: utility-app
        environment: production
    spec:
      containers:
      - name: utility-container
        image: noelav07/utility:1.0    # Current production image
        ports:
        - containerPort: 8090
        env:
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 30
