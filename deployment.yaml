apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailon-app
  namespace: staging
  labels:
    app: ailon-app
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ailon-app
  template:
    metadata:
      labels:
        app: ailon-app
        environment: staging
    spec:
      containers:
      - name: ailon-container
        image: noelav07/ailon:3.0  # staging image
        ports:
        - containerPort: 80
        env:
        - name: ENVIRONMENT
          value: "staging"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
